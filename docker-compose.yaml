#Iniciar el contenedor
#docker compose up -d

#Para comprobar que está activo
#docker compose ps

#para revisar los registros de inicio
#docker logs postgres-gis

services:
  postgis:
    #    image: postgis/postgis
    image: pgrouting/pgrouting:17-3.5-4.0.1
    container_name: postgres-gis
    restart: always

    environment:
      POSTGRES_DB: gisdb
      POSTGRES_USER: gisuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Diagrama/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

  web:
    build:
      context: "./Sitio Web"
    container_name: sitio-web
    restart: always
    environment:
      POSTGRES_HOST: postgis
      POSTGRES_PORT: "5432"
      POSTGRES_DB: gisdb
      POSTGRES_USER: gisuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      WEB_PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      - postgis

volumes:
  postgres_data:

