#Iniciar el contenedor
#docker compose up -d

#Para comprobar que está activo
#docker compose ps

#para revisar los registros de inicio
#docker logs postgres-gis

services:
  postgis:
    #    image: postgis/postgis
    image: pgrouting/pgrouting:17-3.5-4.0.1
    container_name: postgres-gis
    restart: always

    environment:
      POSTGRES_DB: gisdb
      POSTGRES_USER: gisuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:

