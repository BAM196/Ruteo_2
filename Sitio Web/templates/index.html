<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pumalín - ruta por distancia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560&family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='map.css') }}" />
  </head>
  <body>
    <aside class="panel">
      <header>
        <p class="kicker">Tarea 2</p>
        <h1>Pumalín</h1>
        <p class="lead">
          Ruta de ejemplo entre cámaras CONAF (el costo es solo la distancia en
          kilómetros).
        </p>
      </header>
      <form id="route-form">
        <label>
          Inicio
          <select id="start-id" name="start_id"></select>
        </label>
        <label>
          Destino
          <select id="goal-id" name="goal_id"></select>
        </label>
        <button id="route-button" type="submit">Calcular ruta</button>
      </form>
      <p id="route-summary" class="summary">Cargando el parque…</p>
      <p id="route-error" class="error" hidden></p>
      <fieldset>
        <legend>Capas</legend>
        <label
          ><input id="toggle-edges" type="checkbox" checked /> Tramos</label
        >
        <label
          ><input id="toggle-nodes" type="checkbox" checked /> Cámaras</label
        >
        <label><input id="toggle-fires" type="checkbox" checked /> Focos</label>
        <label><input id="toggle-route" type="checkbox" checked /> Ruta</label>
        <label>
          <input id="toggle-meteo" type="checkbox" checked />
          <span>Alertas Meteorológicas</span>
        </label>
      </fieldset>
      <ul class="legend">
        <li><i class="swatch tree"></i> Bosque</li>
        <li><i class="swatch grass"></i> Pastizal</li>
        <li><i class="swatch water"></i> Agua</li>
        <li><i class="swatch other"></i> Otra cobertura</li>
        <li><i class="swatch route"></i> Ruta por distancia</li>
      </ul>
    </aside>
    <main id="map"></main>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="{{ url_for('static', filename='map.js') }}"></script>
  </body>
</html>
