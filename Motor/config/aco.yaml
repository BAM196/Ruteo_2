por_defecto: config_zhang

comunes:
  construccion:
    nota: >-
      Cada hormiga sale de la base y elige la siguiente cámara con la regla
      τ^α · η^β, con η = 1 / c_ij (costo del tramo con el modelo). Si ninguna
      cámara cabe en la batería que queda, vuelve a la base y empieza otro
      vuelo, igual que el vehículo de Zhang et al. (2018) vuelve a recargar.
      Toda solución construida es factible.
  busqueda_local:
    nota: >-
      2-opt dentro de un vuelo, mover una cámara a otro vuelo (o a uno nuevo)
      e intercambiar dos cámaras entre vuelos, en la línea de la ILS de
      Zhang et al. (2018). Se acepta un movimiento si es factible y baja el costo.
  q0:
    nota: >-
      Mai et al. (2023, Ec. 15) hacen variar q0 por iteración en dos tramos con
      k0 = 0,7K: q0 = ((K − k)/K) q0_inicial si k < k0, y
      q0 = ((k − k0)/K) q0_inicial + q0_inicial/2 si k ≥ k0. El paper no da
      q0_inicial: 0,9 es una decisión del modelo y se barre en la calibración.
      config_zhang usa q0 = 0 (regla probabilística pura).
  tau0:
    nota: >-
      τ0 = τ_max. Zhang usa 0,01, pero queda bajo la cota τ_min = 0,03 de Mai.
  eta:
    nota: >-
      η_ij = 1 / c_ij, normalizada por el máximo de los candidatos en cada paso
      (con β = 8, una η sin normalizar domina).

config_mai:
  fuente: Mai, Dong y Chen (2023), Intelligence & Robotics 3(4), 666-684
  alpha: 1
  beta: 8
  rho: 0.2
  hormigas: 10
  iteraciones: 500
  sin_mejora: null
  tau_min: 0.03
  tau_max: 0.9
  q0_calendario: mai
  q0_inicial: 0.9
  q0_k0: 0.7
  elite: 0
  pasos_busqueda_local: 20

config_zhang:
  fuente: Zhang, Gajpal, Appadoo y Abdulkader (2018), Int. J. Production Economics 203, 404-413
  alpha: 5
  beta: 5
  rho: 0.1
  hormigas: 10
  iteraciones: 150
  sin_mejora: 25
  tau_min: 0.03
  tau_max: 0.9
  q0_calendario: fijo
  q0: 0.0
  elite: 10
  pasos_busqueda_local: 20

calibracion:
  semillas: 30
  base: config_mai
  iteraciones: 100
  alpha: [1, 2, 5, 8]
  beta: [1, 2, 5, 8]
  rho: [0.1, 0.2, 0.5]
  hormigas: [10, 30]
  q0_inicial: [0.0, 0.5, 0.9]
